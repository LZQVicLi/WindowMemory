name: Bug report / 问题反馈
description: Report a reproducible window, display or startup problem.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App and macOS versions
      placeholder: WindowMemory 1.2.0, macOS 15.7, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Display setup and affected apps
      description: Share display count and app names; remove private window titles and file paths.
